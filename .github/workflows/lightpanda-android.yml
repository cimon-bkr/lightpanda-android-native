name: Lightpanda for Android (stages 2 and 3)

on:
  push:
    branches: [stage3]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIGHTPANDA_TAG: "1.0.3"

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Get Lightpanda ${{ env.LIGHTPANDA_TAG }}
        run: git clone --depth 1 --branch "$LIGHTPANDA_TAG" https://github.com/lightpanda-io/browser.git lp

      - name: Android NDK paths
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
          echo "NDK: $NDK"; ls "$TOOLS/bin" | grep -E 'aarch64-linux-android(29|30)-clang$' | head
          cat > "$RUNNER_TEMP/libc.txt" <<LIBC
          include_dir=$TOOLS/sysroot/usr/include
          sys_include_dir=$TOOLS/sysroot/usr/include/aarch64-linux-android
          crt_dir=$TOOLS/sysroot/usr/lib/aarch64-linux-android/29
          msvc_lib_dir=
          kernel32_lib_dir=
          cc_dir=$TOOLS/sysroot/usr/lib/aarch64-linux-android/29
          darwin_sdk_dir=
          LIBC
          sed -i 's/^ *//' "$RUNNER_TEMP/libc.txt"
          cat "$RUNNER_TEMP/libc.txt"

      - name: "Stage 2: Rust parser for Android"
        run: |
          set -o pipefail
          export CC_aarch64_linux_android="$TOOLS/bin/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$TOOLS/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLS/bin/aarch64-linux-android29-clang"
          cd lp
          cargo build --release --target aarch64-linux-android --manifest-path src/rust/ffi/Cargo.toml 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
          f=$(find . -name liblightpanda_ffi.a -path '*aarch64-linux-android/release*' | head -1)
          echo "rust archive: $f"; ls -l "$f"
          echo "RUST_A=$PWD/$f" >> "$GITHUB_ENV"

      - name: "Stage 3 (dry run): stand-in for V8, compile everything else"
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          echo 'int lp_v8_stand_in;' > d.c
          "$TOOLS/bin/aarch64-linux-android29-clang" -c d.c -o d.o
          "$TOOLS/bin/llvm-ar" rcs libc_v8.a d.o
          cd "$GITHUB_WORKSPACE/lp"
          python3 "$GITHUB_WORKSPACE/patches/patch_lightpanda.py" build.zig
          zig fmt build.zig
          zig build --libc "$RUNNER_TEMP/libc.txt" -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe \
            -Dprebuilt_v8_path="$RUNNER_TEMP/libc_v8.a" -Dprebuilt_rust_path="$RUST_A" -Dandroid_sysroot="$TOOLS/sysroot" 2>&1 | tee -a "$RUNNER_TEMP/log.txt"

      - name: Show the useful parts of the log if something failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/log.txt"
          # 1) the failing commands, shortened
          grep -n "failed command" "$log" | cut -c1-900 | head -6 > "$RUNNER_TEMP/a.txt" || true
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/a.txt" | cut -c1-7000)
          echo "::error title=Failing commands::$msg"
          # 2) distinct error lines
          grep -E "error:|error\(" "$log" | sed 's#/usr/local/lib/android/sdk/ndk/[^/]*/toolchains/llvm/prebuilt/linux-x86_64/sysroot#NDK#' | cut -c1-260 | awk '!seen[$0]++' | head -25 > "$RUNNER_TEMP/b.txt" || true
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/b.txt" | cut -c1-7000)
          echo "::error title=Distinct errors::$msg"
          # 3) which build steps failed
          grep -E "^\+- |failure" "$log" | cut -c1-200 | head -20 > "$RUNNER_TEMP/c.txt" || true
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/c.txt" | cut -c1-5000)
          echo "::error title=Failed steps::$msg"
